<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c1430">
  <title>Bravo Stars</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main id="menue" hidden>
    <div class="leiste">
      <span id="gesamt" class="gesamt">🏆 0</span>
      <button id="ton" class="ico" type="button" aria-label="Ton an/aus">🔊</button>
    </div>
    <header>
      <h1>BRAVO<br><span>STARS</span></h1>
      <p>Die Klasse aus Crazy Lineup prügelt sich – mit Stempeln, Kamelspucke und Natrium.</p>
    </header>
    <nav id="tabs" class="tabs" aria-label="Menü"></nav>
    <section id="seite" class="wahl"></section>
  </main>
  <div id="spiel" hidden></div>
  <div id="ergebnis" class="ergebnis" hidden></div>
  <div id="truhe" class="truhe" hidden></div>

  <script src="js/pixel.js?v=4"></script>
  <script src="js/sprites.js?v=4"></script>
  <script src="js/netz.js?v=4"></script>
  <script src="js/daten.js?v=4"></script>
  <script src="js/extras.js?v=4"></script>
  <script src="js/spiel.js?v=4"></script>
  <script src="js/menue.js?v=4"></script>
  <!-- Rangliste der Spielesammlung: meldet Spielzeit, Pokale und Progress, Spielstand in der Cloud -->
  <script src="https://rangliste-aoee.onrender.com/melder.js" data-spiel="Bravo Stars" data-speicher="bravostars." data-speicher-ohne="bravostars.stumm" defer></script>
</body>
</html>
