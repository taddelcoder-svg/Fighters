<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c1430">
  <title>Bravo Stars</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <main id="menue" hidden>
    <div class="strahlen" aria-hidden="true"></div>
    <header class="topbar">
      <button id="profil" class="profil" type="button" aria-label="Profil und Rang"></button>
      <div id="waehrung" class="waehrung"></div>
      <button id="ton" class="rundknopf" type="button" aria-label="Ton an/aus">🔊</button>
    </header>
    <div id="home" class="home">
      <nav id="leiste" class="leiste" aria-label="Menü"></nav>
      <div class="buehne">
        <h1 class="logo">BRAVO<span>STARS</span></h1>
        <div id="held" class="held"></div>
      </div>
      <div class="unten">
        <button id="freunde" class="knopf blau freundeknopf" type="button"></button>
        <button id="moduswahl" class="modusbanner" type="button"></button>
        <button id="los" class="spielenknopf" type="button">SPIELEN</button>
      </div>
    </div>
    <section id="screen" class="screen" hidden>
      <div class="screenkopf"><button id="zurueck" class="rundknopf zurueck" type="button" aria-label="Zurück">‹</button><h2 id="screentitel"></h2></div>
      <div id="seite" class="seiteninhalt"></div>
    </section>
  </main>
  <div id="spiel" hidden></div>
  <div id="ergebnis" class="ergebnis" hidden></div>
  <div id="truhe" class="truhe" hidden></div>

  <script src="js/pixel.js?v=6"></script>
  <script src="js/sprites.js?v=6"></script>
  <script src="js/netz.js?v=6"></script>
  <script src="js/daten.js?v=6"></script>
  <script src="js/extras.js?v=6"></script>
  <script src="js/spiel.js?v=6"></script>
  <script src="js/menue.js?v=6"></script>
  <!-- Rangliste der Spielesammlung: meldet Spielzeit, Pokale und Progress, Spielstand in der Cloud -->
  <script src="https://rangliste-aoee.onrender.com/melder.js" data-spiel="Bravo Stars" data-speicher="bravostars." data-speicher-ohne="bravostars.stumm" defer></script>
</body>
</html>
